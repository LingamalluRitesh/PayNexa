version: '3.8'

services:
  paynexa-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paynexa-banking-server
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - HOST=0.0.0.0
      - PAYNEXA_MASTER_SECRET=paynexa_production_vault_secret_key_2026
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  paynexa-client:
    image: node:20-alpine
    container_name: paynexa-frontend
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev --workspace=client -- --host 0.0.0.0"
    depends_on:
      - paynexa-server
    restart: unless-stopped
